name: Check research and application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/verify-cn-fuel-author-revision.py
      - run: python3 scripts/verify-cn-mineral-author-revision.py
      - run: python3 scripts/verify-cn-machinery-independent-review.py
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- data/research.json data/site.json
      - run: npm run worker:check
